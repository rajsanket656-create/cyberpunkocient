<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Terminal - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background effects -->
  <div class="scanlines"></div>
  <div class="matrix-overlay"></div>

  <div class="terminal-container">
    <div class="terminal-header">
      <span class="glitch" data-text="SYSTEM AUTHENTICATION REQUIRED">SYSTEM AUTHENTICATION REQUIRED</span>
    </div>
    
    <div class="terminal-body" id="auth-container">
      <div id="error-message" class="error-msg hidden"></div>
      <div id="success-message" class="success-msg hidden"></div>
      
      <form id="auth-form">
        <div class="input-group">
          <label for="email">> EMAIL_</label>
          <input type="email" id="email" required autocomplete="off" placeholder="agent@osint.sys">
        </div>
        <div class="input-group">
          <label for="password">> PASSWORD_</label>
          <input type="password" id="password" required autocomplete="off" placeholder="***********">
        </div>
        
        <div class="button-group">
          <button type="button" id="btn-login" class="btn">INITIALIZE_LOGIN</button>
          <button type="button" id="btn-register" class="btn btn-alt">REGISTER_NEW_NODE</button>
        </div>
        <div class="button-group" style="margin-top: 15px;">
          <button type="button" id="btn-resend" class="btn btn-alt hidden">RESEND_VERIFICATION_EMAIL</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script src="js/matrix.js"></script>
</body>
</html>
