<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Terminal - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background effects -->
  <div class="scanlines"></div>
  <div class="matrix-overlay"></div>

  <div class="terminal-container wide">
    <div class="terminal-header">
      <span class="glitch" data-text="OSINT DATABASE ACCESS">OSINT DATABASE ACCESS</span>
    </div>
    
    <div class="terminal-body">
      <div class="terminal-nav">
        <span>LOGGED_IN: <span id="user-email" class="typing">...</span></span>
        <a href="#" id="btn-logout" class="nav-link">[TERMINATE_SESSION]</a>
      </div>

      <div class="status-bar" style="align-items: center;">
        <div>STATUS: <span style="color: #00ff41;">CONNECTED</span></div>
        <div style="display: flex; align-items: center; gap: 10px;">
          CREDITS_REMAINING: <span id="credit-count">--</span>
          <a href="https://wa.me/7377504157" target="_blank" class="btn btn-alt" style="padding: 2px 8px; font-size: 0.8rem; text-decoration: none;">[PURCHASE]</a>
        </div>
      </div>
      
      <div id="error-message" class="error-msg hidden"></div>
      <div id="success-message" class="success-msg hidden"></div>
      
      <form id="lookup-form" style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
        <div class="input-group" style="flex: 1; margin: 0;">
          <label for="mobile-number">> TARGET_MOBILE_NUMBER_</label>
          <input type="text" id="mobile-number" required autocomplete="off" placeholder="e.g. 9876543210">
        </div>
        <button type="submit" id="btn-search" class="btn" style="height: 40px; margin: 0;">EXECUTE_QUERY</button>
      </form>

      <label>> QUERY_RESULTS_</label>
      <div style="position: relative;">
        <button id="btn-copy" class="copy-icon hidden" title="Copy Data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <div class="result-window" id="result-output">
          <span class="blinking-cursor">WAITING_FOR_INPUT</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/dashboard.js?v=4"></script>
  <script src="js/matrix.js"></script>
</body>
</html>
